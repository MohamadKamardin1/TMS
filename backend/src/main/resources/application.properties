# ============================================================
# TMS REST API Backend - Configuration
# ============================================================

# ---------------- Server ----------------
server.port=8080
# Uncomment if the whole API should live under /api
# server.servlet.context-path=/api

# ---------------- MySQL Database ----------------
# The database `tms` must already exist:
#   CREATE DATABASE tms CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/tms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# ddl-auto=update auto-generates schema from entities while developing.
# Switch to validate (and add Flyway migrations) before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------- File upload limits ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Local directory where uploaded reference images are stored (served at /uploads/**).
app.upload.dir=${UPLOAD_DIR:./uploads}

# ---------------- Springdoc OpenAPI (Swagger UI) ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- JSON Web Token (stateless auth) ----------------
# 256-bit secret (hex). Override via JWT_SECRET env var in production.
app.jwt.secret=${JWT_SECRET:2d1f76027796725264a2da41e50cb56b3e1c2d4e09688d984f73df1a3e59c3f7}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- Bootstrap / seed data ----------------
# Seeded only when the database is empty. Each credential is overridable
# via its *_PASSWORD (or matching JAVA_TOOL_OPTIONS/SPRING_APPLICATION_JSON)
# environment variable for production.
app.seed.admin-username=admin
app.seed.admin-email=admin@tms.local
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.tailor-username=tailor1
app.seed.tailor-email=tailor1@tms.local
app.seed.tailor-password=${TAILOR_PASSWORD:tailor123}
app.seed.cashier-username=cashier1
app.seed.cashier-email=cashier1@tms.local
app.seed.cashier-password=${CASHIER_PASSWORD:cashier123}
app.seed.delivery-username=delivery1
app.seed.delivery-email=delivery1@tms.local
app.seed.delivery-password=${DELIVERY_PASSWORD:delivery123}
app.seed.customer-username=customer1
app.seed.customer-email=customer1@tms.local
app.seed.customer-password=${CUSTOMER_PASSWORD:customer123}