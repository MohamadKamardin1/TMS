# ============================================================
# TMS REST API Backend - Configuration
# ============================================================

# ---------------- Server ----------------
server.port=8080
# Uncomment if the whole API should live under /api
# server.servlet.context-path=/api

# ---------------- MySQL Database ----------------
# The database `tms_db` is created automatically if missing, or manually:
#   CREATE DATABASE tms_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/tms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# ddl-auto=update auto-generates schema from entities while developing.
# Switch to validate (and add Flyway migrations) before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------- File upload limits ----------------
# Each reference image may be up to 10MB; a request may carry several images.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
# Local directory where uploaded reference images are stored (served at /uploads/**).
app.upload.dir=${UPLOAD_DIR:./uploads}

# ---------------- Springdoc OpenAPI (Swagger UI) ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- JSON Web Token (stateless auth) ----------------
# 256-bit secret (hex). Override via JWT_SECRET env var in production.
app.jwt.secret=${JWT_SECRET:2d1f76027796725264a2da41e50cb56b3e1c2d4e09688d984f73df1a3e59c3f7}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- Bootstrap / seed data ----------------
# Accounts are seeded only when their email does not already exist. Each
# credential is overridable via its *_PASSWORD (or matching
# JAVA_TOOL_OPTIONS/SPRING_APPLICATION_JSON) environment variable for production.
app.seed.admin-email=admin@gmail.com
app.seed.admin-password=${ADMIN_PASSWORD:123456}
app.seed.admin-full-name=Admin User
app.seed.tailor-email=tailor@gmail.com
app.seed.tailor-password=${TAILOR_PASSWORD:123456}
app.seed.tailor-full-name=Tailor Worker
app.seed.cashier-email=cashier@gmail.com
app.seed.cashier-password=${CASHIER_PASSWORD:123456}
app.seed.cashier-full-name=Cashier Staff
app.seed.delivery-email=delivery@gmail.com
app.seed.delivery-password=${DELIVERY_PASSWORD:123456}
app.seed.delivery-full-name=Delivery Agent
app.seed.customer-email=customer@gmail.com
app.seed.customer-password=${CUSTOMER_PASSWORD:123456}
app.seed.customer-full-name=Customer User